<div class="control-group">
    <label for="environment-exposure">Exposure</label>
    <div class="range-control"><input id="environment-exposure" type="range" min="-20" max="20" value="0" /><output id="environment-exposure-value" class="range-value">0</output></div>
</div>
<div class="control-group">
    <label for="environment-texture">HDRI Texture</label>
    <select id="environment-texture"></select>
</div>
<div class="control-group">
    <label>HDRI Color</label>
    <div class="range-line"><span>R</span><input id="environment-color-r" type="range" min="0" max="1" value="1" /><output id="environment-color-r-value" class="range-value">1</output></div>
    <div class="range-line"><span>G</span><input id="environment-color-g" type="range" min="0" max="1" value="1" /><output id="environment-color-g-value" class="range-value">1</output></div>
    <div class="range-line"><span>B</span><input id="environment-color-b" type="range" min="0" max="1" value="1" /><output id="environment-color-b-value" class="range-value">1</output></div>
</div>
<div class="control-group">
    <label for="environment-visible-exposure">Visible Exposure</label>
    <div class="range-control"><input id="environment-visible-exposure" type="range" min="-100" max="100" value="0" /><output id="environment-visible-exposure-value" class="range-value">0</output></div>
</div>
<div class="control-group">
    <label for="environment-rotation">Rotation</label>
    <div class="range-control"><input id="environment-rotation" type="range" min="0" max="360" value="0" /><output id="environment-rotation-value" class="range-value">0</output></div>
</div>
